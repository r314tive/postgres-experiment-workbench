          }
          controls_artifact_digest="$(normalize_digest "$SOURCE_CONTROLS_ARTIFACT_DIGEST")"
          draft_artifact_digest="$(normalize_digest "$DRAFT_VERIFICATION_ARTIFACT_DIGEST")"
          [[ "$controls_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$draft_artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
