# Deliberately pressure checkpoint and durable-write paths in a disposable lab.
# This is a stress subject, not a production tuning recommendation.
fsync = on
full_page_writes = on
synchronous_commit = on
wal_compression = off
max_wal_size = '128MB'
min_wal_size = '80MB'
checkpoint_timeout = '30s'
checkpoint_completion_target = 0.5
track_io_timing = on
track_wal_io_timing = on
